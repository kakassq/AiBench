<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AiBench">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1440"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="ab-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D5EFC"/>
      <stop offset="1" stop-color="#38D9A9"/>
    </linearGradient>
  </defs>

  <!-- panel body -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ab-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#6D5EFC" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- storyboard: three shot bars stacked, widths encode the hook / process / cta proportion -->
  <rect x="13" y="13" width="26" height="8" rx="4" fill="url(#ab-accent)"/>
  <rect x="13" y="27" width="38" height="8" rx="4" fill="#E8ECFF" fill-opacity="0.82"/>
  <rect x="13" y="41" width="18" height="8" rx="4" fill="#6D5EFC" fill-opacity="0.55"/>

  <!-- play head -->
  <path d="M40 40.5l10 5.5-10 5.5z" fill="#38D9A9"/>
  <rect x="51" y="41" width="2" height="11" rx="1" fill="#38D9A9" fill-opacity="0.55"/>
</svg>
